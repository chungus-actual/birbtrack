#!/usr/sbin/nft -f
# /etc/nftables.conf on the mic Pi: only the mic port is filtered; everything
# else (ssh, avahi, dhcp) stays open as on stock Raspberry Pi OS.
flush ruleset

table inet birdmic {
	set allow4 {
		type ipv4_addr
		flags interval
		# the machine running BirdNET-Go (a container connects from its host's IP)
		elements = { 192.0.2.10 }
	}

	chain input {
		type filter hook input priority filter; policy accept;
		iif "lo" accept
		tcp dport 8554 ip saddr @allow4 accept
		tcp dport 8554 counter drop
		udp dport 8554 counter drop
	}
}
